apiVersion: 1

providers:
- name: 'dhis2'
  orgId: 1
  folder: ''
  type: file
  disableDeletion: false
  # edits in the UI are allowed but changes will only be internal to Grafana and not sync back the
  # its JSON source, prefer editing the dashboard JSON files directly or export changes made in the
  # UI so they persist
  editable: true
  options:
    path: /etc/grafana/provisioning/dashboards
